<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Party Board: Host</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/vendor/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="host">
    <div id="board-wrap">
      <div id="board"></div>

      <!-- Dice + steps left (DOM so they stay put while the camera moves) -->
      <div id="dice" class="dice-wrap"><div class="die" id="die"></div><div class="die-detail" id="die-detail"></div></div>
      <div id="steps" class="steps-chip hidden"></div>

      <!-- Confetti layer -->
      <div id="confetti" class="confetti"></div>

      <!-- Big announcements (robberies, Stars, item uses…) -->
      <div id="announce" class="announce"></div>

      <!-- Roll-off / roulette / minigame / game-over overlay (shown over the board) -->
      <div id="overlay" class="overlay hidden"><div id="overlay-content"></div></div>
    </div>

    <aside class="sidebar">
      <div class="room-code">
        <small>Join at <span id="join-url"></span></small>
        <div class="code" id="code">····</div>
      </div>

      <div class="turn-counter" id="turn-counter"></div>
      <div class="turn-banner" id="turn-banner">Waiting for players…</div>
      <div class="players" id="players"></div>

      <div class="lobby-controls" id="lobby-controls">
        <label>Board
          <select id="board-select"></select>
        </label>
        <label>Turns
          <select id="rounds">
            <option value="5">5 turns (quick)</option>
            <option value="10" selected>10 turns</option>
            <option value="15">15 turns</option>
            <option value="20">20 turns</option>
          </select>
        </label>
        <button id="start-btn" disabled>Start game</button>
      </div>

      <button id="restart-btn" class="hidden">Play again</button>

      <div class="log" id="log"></div>

      <details class="legend-wrap">
        <summary>Spaces</summary>
        <div class="legend" id="legend"></div>
      </details>
    </aside>
  </div>

  <script src="/js/board-scene.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
