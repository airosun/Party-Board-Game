<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Party Board: Controller</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <main class="phone">
    <!-- Join form -->
    <section id="join-view">
      <h1>📱 Join game</h1>
      <div style="display:grid; gap:12px">
        <input id="code-input" placeholder="Room code" maxlength="4" autocapitalize="characters" autocomplete="off" />
        <input id="name-input" placeholder="Your name" maxlength="12" autocomplete="off" />
        <button id="join-btn">Join</button>
        <div class="error" id="join-error"></div>
      </div>
    </section>

    <!-- In-game controller -->
    <section id="game-view" class="hidden" style="display:flex; flex-direction:column; gap:14px; flex:1">
      <header>
        <div class="me"><span class="dot" id="my-dot"></span><span id="my-name"></span></div>
        <div class="turn-pill" id="turn-pill"></div>
        <div class="stats" id="my-stats"></div>
      </header>
      <div class="status" id="status"></div>
      <div class="nudges" id="nudges"></div>
      <div class="actions" id="actions"></div>
      <div class="bag" id="bag"></div>
    </section>
  </main>

  <div class="big-pop" id="big-pop"></div>
  <div class="toasts" id="toasts"></div>

  <script src="/js/controls.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
